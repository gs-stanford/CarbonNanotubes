[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-property-tables"
version = "0.3.1"
description = "Citation-preserving scientific figure client for Carbon Property Tables"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Gaurav Sharma" },
  { name = "Adam M. Boies" }
]
keywords = [
  "materials science",
  "carbon nanotubes",
  "materials properties",
  "scientific data",
  "citations"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed"
]
dependencies = ["certifi>=2024.7.4"]

[project.scripts]
cpt-feature-tour = "carbon_property_tables.feature_tour:main"

[project.urls]
Homepage = "https://carbonnanotubes.onrender.com"
Documentation = "https://carbonnanotubes.onrender.com/api/v1"
Source = "https://github.com/gs-stanford/CarbonNanotubes"
Issues = "https://github.com/gs-stanford/CarbonNanotubes/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carbon_property_tables = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
