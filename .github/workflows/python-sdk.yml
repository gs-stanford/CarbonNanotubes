name: Python SDK

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-sdk.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-sdk.yml"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Optional trusted-publishing destination"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install -e './python[dev]'
      - name: Run unit tests
        run: python -m pytest python/tests
      - name: Build distributions
        run: python -m build python
      - name: Check distribution metadata
        run: python -m twine check python/dist/*
      - name: Smoke-test the wheel in isolation
        run: |
          python -m venv /tmp/cpt-wheel-test
          /tmp/cpt-wheel-test/bin/python -m pip install python/dist/*.whl
          /tmp/cpt-wheel-test/bin/python -c "import carbon_property_tables as cpt; print(cpt.__version__)"
          /tmp/cpt-wheel-test/bin/cpt-feature-tour --help
      - name: Run the installed feature tour against production
        if: github.event_name == 'workflow_dispatch' && inputs.publish_target != 'none'
        run: /tmp/cpt-wheel-test/bin/cpt-feature-tour --output-dir /tmp/cpt-feature-tour
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.publish_target != 'none'
        with:
          name: sdk-feature-tour
          path: /tmp/cpt-feature-tour/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
